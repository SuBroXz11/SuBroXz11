
      <svg
        width="705" 
        height="120" 
        viewBox="0 0 705 120" 
        xmlns="http://www.w3.org/2000/svg"
      >
        <style>
            #text-group {
                animation: replay 5.7s linear infinite;
            }
            @keyframes replay {
                0% { opacity: 1; }
                90% { opacity: 1; }
                100% { opacity: 0; }
            }
        </style>
        <g id="text-group">
            <rect width="100%" height="100%" fill="none"/>
            <defs>
              <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <g filter="url(#neon-glow)">
                {/* --- ZERO GAP FIX --- */}
                <text 
                  class="text-container" 
                  x="15" 
                  y="50%" 
                  text-anchor="start" 
                  dominant-baseline="middle"
                >
                  
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
        
        .text-container {
          font-family: 'Caveat', cursive;
          font-size: 80px;
          font-weight: 700;
          stroke: #00e5ff;
          stroke-width: 2.5px;
          fill: none;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .char {
          stroke-dasharray: 500;
          stroke-dashoffset: 500;
          animation: draw 0.8s ease-out forwards;
        }

        @keyframes draw {
          to {
            stroke-dashoffset: 0;
          }
        }
      </style>
    
                  <tspan class="char" style="animation-delay: 0s;">H</tspan><tspan class="char" style="animation-delay: 0.15s;">i</tspan><tspan class="char" style="animation-delay: 0.3s;">,</tspan><tspan> </tspan><tspan class="char" style="animation-delay: 0.6s;">I</tspan><tspan class="char" style="animation-delay: 0.75s;">'</tspan><tspan class="char" style="animation-delay: 0.8999999999999999s;">m</tspan><tspan> </tspan><tspan class="char" style="animation-delay: 1.2s;">S</tspan><tspan class="char" style="animation-delay: 1.3499999999999999s;">u</tspan><tspan class="char" style="animation-delay: 1.5s;">b</tspan><tspan class="char" style="animation-delay: 1.65s;">r</tspan><tspan class="char" style="animation-delay: 1.7999999999999998s;">a</tspan><tspan class="char" style="animation-delay: 1.95s;">t</tspan><tspan class="char" style="animation-delay: 2.1s;">.</tspan><tspan class="char" style="animation-delay: 2.25s;">.</tspan><tspan class="char" style="animation-delay: 2.4s;">.</tspan>
                </text>
            </g>
        </g>
      </svg>
    